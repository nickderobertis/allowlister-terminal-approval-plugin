name: llmlint

# LLM-judge tier (llmlint) — a blocking PR check, SEPARATE from the `check` gate.
# It is non-deterministic and needs an authenticated harness, so it never runs
# inside `just check`. Scoped to the lines this PR changed (the merge-base diff
# with main) so a PR pays for its own changes, not a full-repo sweep. It REQUIRES
# the harness credential and fails fast without it — it never no-ops to green,
# which would report unlinted files as clean. Fork PRs are gated at the repo level
# (Settings → Actions → General → Fork pull request workflows → require approval),
# not by a no-op here, so secrets stay restricted on fork PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: llmlint-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  llmlint:
    name: llmlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the PR head (not the synthetic merge ref) with full history so
      # the merge-base with main resolves.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main
      - uses: extractions/setup-just@v3
      # setup-llmlint.sh installs llmlint via `uv tool`; uv is not preinstalled on
      # the runner, so provision it first (the script no-ops without it).
      - uses: astral-sh/setup-uv@v6
      - name: Install oneharness + llmlint
        run: |
          ./scripts/setup-llmlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint changed files
        env:
          # Harness credential (Claude Code). Prefer a long-lived subscription
          # token from `claude setup-token` (CLAUDE_CODE_OAUTH_TOKEN); a metered
          # API key (ANTHROPIC_API_KEY) also works. The step fails fast with a
          # clear message when neither secret is set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::llmlint needs a harness credential. Add a CLAUDE_CODE_OAUTH_TOKEN secret" \
                 "(from 'claude setup-token', recommended) or an ANTHROPIC_API_KEY secret" \
                 "(Settings → Secrets and variables → Actions). Fork PRs are gated by the" \
                 "require-approval-for-fork-workflows setting; see the create-repo references." >&2
            exit 1
          fi
          just lint-llm-diff origin/main
