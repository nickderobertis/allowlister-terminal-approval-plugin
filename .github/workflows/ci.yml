name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run the macOS diagnostic lane
        type: boolean
        default: false

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Authenticate cargo-binstall's GitHub API calls in `just bootstrap` so it is
  # not rate-limited.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  macos-policy:
    runs-on: ubuntu-latest
    outputs:
      macosRequired: ${{ steps.policy.outputs.macosRequired }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/macos-policy.mjs classify --event "$GITHUB_EVENT_PATH" --base "$BASE" --head "$HEAD"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      # Full history: the affected tier resolves its merge base from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs Nx, the orchestrator every gate recipe delegates to. This is the
      # dev toolchain's Node; install-smoke and publish keep Node 20 because they
      # prove the npm carrier on its `engines` floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache ~/.cargo/bin: a stale cached tool binary collides with
          # bootstrap's reinstall. Reinstalling the prebuilt each run is cheap.
          cache-bin: false
      # Prebuilt binaries for the cargo subcommands the gate needs; `bootstrap`
      # below is idempotent and no-ops over anything already present.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Install workflow linter
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Bootstrap
        run: just bootstrap
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Gate (just check)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just check "$TIER"

  # llmlint: ignore-block[no_second_broader_sweep_over_an_already_gated_commit] this job runs no gating target and no sweep: only pool-maintenance:budgets-host, one host budget measurement that the declared-maintenance task requires on the release PR after its gate; its two builds construct the superseded-build workload the timed pruner pass removes, and the figure is that pass alone.
  # The pool-maintenance pass-time budget (pool-maintenance/budgets.yaml) builds
  # the workspace twice, so only the release PR's full sweep pays for it: after
  # every gate leg, on the tier the router picks; on any other event it stops
  # once routed.
  pool-maintenance-budget:
    name: pool-maintenance budget
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Install pinned toolchain
        if: steps.tier.outputs.tier == 'all'
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: steps.tier.outputs.tier == 'all'
        with:
          cache-bin: false
      - uses: taiki-e/install-action@v2
        if: steps.tier.outputs.tier == 'all'
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Bootstrap
        if: steps.tier.outputs.tier == 'all'
        run: just bootstrap
      - name: Pool-maintenance budget
        if: steps.tier.outputs.tier == 'all'
        run: just pool-maintenance-budget
  # llmlint: ignore-end[no_second_broader_sweep_over_an_already_gated_commit]

  macos-test:
    name: macOS PR proof
    needs: macos-policy
    if: needs.macos-policy.outputs.macosRequired == 'true' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Full history: the affected tier resolves its merge base from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs Nx, the orchestrator every gate recipe delegates to. This is the
      # dev toolchain's Node; install-smoke and publish keep Node 20 because they
      # prove the npm carrier on its `engines` floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache ~/.cargo/bin: a stale cached tool binary collides with
          # bootstrap's reinstall. Reinstalling the prebuilt each run is cheap.
          cache-bin: false
      # Prebuilt binaries for the cargo subcommands the gate needs; `bootstrap`
      # below is idempotent and no-ops over anything already present.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Install workflow linter
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Bootstrap
        run: just bootstrap
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Gate (just check)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just check "$TIER"

  macos-result:
    name: test (macos-latest)
    needs: [macos-policy, macos-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report the required macOS context
        env:
          MACOS_REQUIRED: ${{ needs.macos-policy.outputs.macosRequired }}
          POLICY_RESULT: ${{ needs.macos-policy.result }}
          PROOF_RESULT: ${{ needs.macos-test.result }}
        run: node .github/required-result.mjs "$POLICY_RESULT" "$PROOF_RESULT"

  # Prove the npm install path a user actually takes: build the host binary,
  # stage it into the matching platform package, unit-test the JS resolver, then
  # install the packed package and smoke the linked native binary — separate from
  # the dev gate, which only sets up the dev environment.
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit-test the platform resolver
        run: npm test
      - uses: extractions/setup-just@v3
      - name: Build the release binary
        run: just build-release
      - name: Match npm smoke versions to the built binary
        run: npm run release:set-npm-version -- "$(target/release/allowlister-terminal-approval-plugin --version)"
      - name: Stage the native binary into its platform package
        # Name the host binary as the release artifact `release:stage-npm` expects,
        # then stage it with the same script the publish workflow uses — host
        # platform only, since this job builds just the one binary.
        run: |
          mkdir -p dist/artifacts
          cp target/release/allowlister-terminal-approval-plugin \
            dist/artifacts/allowlister-terminal-approval-plugin-linux-x64
          npm run release:stage-npm -- dist/artifacts linux-x64
      - name: Smoke-test the npm install path
        run: npm run release:smoke-npm
