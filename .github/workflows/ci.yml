name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Authenticate cargo-binstall's GitHub API calls in `just bootstrap` so it is
  # not rate-limited.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The gate. A clean checkout runs `just bootstrap` then `just check` at the
  # tier .github/scripts/gate-tier.mjs routes the event to (the release model and
  # this placement are recorded in AGENTS.md "Commits, releases, and merging"):
  #
  #   * a pull request from release-plz's release branch runs the FULL SWEEP
  #     (`just check all`) — the repo batches releases behind that PR, so this is
  #     the one point the broader tier runs, and a red sweep fails these required
  #     contexts so auto-merge cannot cut a release past it;
  #   * every other pull request, and every push to main, runs the AFFECTED tier
  #     (`just check affected`) against the explicitly derived base the router
  #     exports as NX_BASE (the merge base with the PR's base branch, or the
  #     push's previous tip).
  #
  # Matrix over the unix platforms the binary ships to. The context names
  # (`test (ubuntu-latest)`, ...) are the protected required checks — keep them
  # stable. No `if`, `needs` or path filter: each cell reports on every pull
  # request, including one whose targets are all unaffected (Nx runs nothing and
  # the job passes). .github/tests/workflow-contract.test.mjs enforces this.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      # Full history: the affected tier resolves its merge base from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs Nx, the orchestrator every gate recipe delegates to. This is the
      # dev toolchain's Node; install-smoke and publish keep Node 20 because they
      # prove the npm carrier on its `engines` floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache ~/.cargo/bin: a stale cached tool binary collides with
          # bootstrap's reinstall. Reinstalling the prebuilt each run is cheap.
          cache-bin: false
      # Prebuilt binaries for the cargo subcommands the gate needs; `bootstrap`
      # below is idempotent and no-ops over anything already present.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Bootstrap
        run: just bootstrap
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Gate (just check)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just check "$TIER"

  # Prove the npm install path a user actually takes: build the host binary,
  # stage it into the matching platform package, unit-test the JS resolver, then
  # install the packed package and smoke the linked native binary — separate from
  # the dev gate, which only sets up the dev environment.
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit-test the platform resolver
        run: npm test
      - uses: extractions/setup-just@v3
      - name: Build the release binary
        run: just build-release
      - name: Stage the native binary into its platform package
        # Name the host binary as the release artifact `release:stage-npm` expects,
        # then stage it with the same script the publish workflow uses — host
        # platform only, since this job builds just the one binary.
        run: |
          mkdir -p dist/artifacts
          cp target/release/allowlister-terminal-approval-plugin \
            dist/artifacts/allowlister-terminal-approval-plugin-linux-x64
          npm run release:stage-npm -- dist/artifacts linux-x64
      - name: Smoke-test the npm install path
        run: npm run release:smoke-npm
