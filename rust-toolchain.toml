# Pinned toolchain for reproducible local and CI builds. The channel is an exact
# stable release so `cargo +<channel>` resolves identically everywhere; bump
# deliberately alongside a `just upgrade`.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = [
    # Linux host (dev + the local gate).
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Release targets: static, non-PIE musl on Linux (see .cargo/config.toml);
    # macOS ships x86_64 + arm64. The terminal experience is unix-only, so no
    # Windows target.
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
profile = "minimal"
